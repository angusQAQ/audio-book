<text x="534" y="99.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">帽</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">回</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">的</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">籃</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">呢</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">？</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
