<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>兩位朋友已在同一左岸，亮亮雙手接回紅帽，波波頭上沒有帽，攤爪笑；大葉子及莓子已由波波帶回岸邊放在大岩石上，沒有第二頂帽或真正籃子。</title><image href="../assets/illustrations/s09.png" width="1774" height="887"/></svg>
<text x="52" y="60.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">亮</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">亮</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">接</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">回</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">帽</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
