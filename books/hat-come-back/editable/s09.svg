<text x="52" y="99.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">高</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">興</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">得</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">搖</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">搖</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">耳</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">朵</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
<text x="534" y="60.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">波</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">波</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">攤</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">開</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">爪</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan></text>
