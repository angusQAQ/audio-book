<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>較近的小島鏡頭，波波在島上捧着唯一紅帽，帽口朝上，內有幾顆紅莓子；亮亮在遠方左岸張嘴驚訝。沒有真正野餐籃，只有帽子被誤認為籃子。</title><image href="../assets/illustrations/s06.png" width="1774" height="887"/></svg>
