<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>兩個朋友在左岸大岩石兩側，紅帽帽口向上放岩石上，莓子在帽裏；兩人各用一隻前掌按住帽子邊以免風吹，笑着野餐。只有一頂帽，兩人頭上都沒有帽；大葉子空着放旁邊。</title><image href="../assets/illustrations/s10.png" width="1774" height="887"/></svg>
