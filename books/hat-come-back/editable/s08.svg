<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>波波戴唯一紅帽，頭與眼睛清楚露出，游向左岸的亮亮；水面自然遮住下半身，一隻前爪把裝莓子的大葉子托在水面上，另一前爪及扁尾划水連貫。小島上沒有留下葉子或莓子，沒有帽子留在島上或河面。</title><image href="../assets/illustrations/s08.png" width="1774" height="887"/></svg>
