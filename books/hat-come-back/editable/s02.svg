<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>唯一紅帽已從亮亮頭上飛走，正落在大灰岩頂部；山羊在岩石左下跳起伸前掌，沒有戴第二頂帽子。海狸不在此鏡頭內，背景同一河岸。</title><image href="../assets/illustrations/s02.png" width="1774" height="887"/></svg>
