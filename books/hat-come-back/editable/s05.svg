<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>亮亮站左岸，拿一根長樹枝伸向小島邊的唯一紅帽，枝端仍差一小段；島上只露海狸的一隻棕色前爪接近帽子邊，身體藏在低矮草叢後；沒有第二隻動物或第二頂帽。</title><image href="../assets/illustrations/s05.png" width="1774" height="887"/></svg>
