<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>亮亮左岸一手指自己頭頂、一手朝島上說話；波波右島上把紅帽帽口朝上拿在胸前，幾顆莓子仍在裏面，低頭恍然；兩者隔着河水，不畫第二個波波。</title><image href="../assets/illustrations/s07.png" width="1774" height="887"/></svg>
<text x="52" y="60.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">亮</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">亮</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">大</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">聲</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">說</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan></text>
<line data-proper-name="亮亮" x1="52.4" y1="64.76" x2="99.6" y2="64.76" stroke="#3E4A3C" stroke-width="0.7"/>
<text x="52" y="99.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">那</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">是</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">的</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">帽</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">呀</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
<text x="534" y="60.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">波</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">波</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">看</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">看</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">帽</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
<line data-proper-name="波波" x1="534.4" y1="64.76" x2="581.6" y2="64.76" stroke="#3E4A3C" stroke-width="0.7"/>
<text x="534" y="99.56" fill="#3E4A3C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">又</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">看</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">看</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">莓</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
<text x="38" y="580.87" fill="#7A8870" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="10.5">1</tspan><tspan font-family="Iansui" font-weight="400" font-size="10.5">4</tspan></text>
<text x="905" y="580.87" fill="#7A8870" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="10.5">1</tspan><tspan font-family="Iansui" font-weight="400" font-size="10.5">5</tspan></text></svg>