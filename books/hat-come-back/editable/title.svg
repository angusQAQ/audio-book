<svg x="96.51933701657458" y="336.12333333333333" width="77.96132596685084" height="181.75333333333336" viewBox="126.0 0 309.0 720.38"><title>亮亮，擬人小山羊；瘦高、長窄鼻面、兩個小向後彎的米色角、細長橫瞳小眼、長金棕耳內、小撮下巴毛、奶白短毛，蹄形前掌及兩隻分趾後蹄。紫色細條紋背心、土黃短褲，無鞋；常用兩隻後腿站立，不是人戴羊頭。</title><image href="../assets/characters.png" width="2172" height="724"/></svg>
<svg x="272.4981583793739" y="336.12333333333333" width="110.00368324125228" height="181.75333333333336" viewBox="1112.0 0 435.99999999999983 720.38"><title>波波，擬人小海狸；比山羊矮一個頭、圓矮結實、寬扁口鼻、兩顆短平門牙、深棕小圓耳、橘棕毛與奶油色口鼻，粗扁格紋尾巴、四指圓前爪及後蹼腳。湖藍無袖背心、無褲無鞋；可以在童話中用前爪拿物或游水，不能畫成水獺、老鼠或第二隻羊。</title><image href="../assets/characters.png" width="2172" height="724"/></svg>
