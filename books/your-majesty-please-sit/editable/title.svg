<svg x="98.79005524861878" y="336.12333333333333" width="73.41988950276243" height="181.75333333333336" viewBox="97.0 0 291.0 720.38"><title>丁丁，擬人小白兔；瘦小靈活、很長窄耳朵且耳尖一前一後，窄倒三角兔臉、小斜杏眼、梅紅三角鼻、兩顆短白門牙、細雀斑、短圓尾，奶白毛。靛青短袖連身褲配奶油色短袖上衣，無鞋，前爪可拿沙、後腿站立或蹲坐；不是玩具布偶。</title><image href="../assets/characters.png" width="2172" height="724"/></svg>
<svg x="249.79097605893185" y="336.12333333333333" width="155.4180478821363" height="181.75333333333336" viewBox="938.0 0 616.0 720.38"><title>圓圓，擬人大象朋友；比兔高約1.6倍，寬圓身軀、大扇形耳朵、短粗向上彎象鼻、細小下垂眼、寬笑嘴、灰藍皮膚，沒有象牙，兩隻前掌與兩隻粗後腳。磚紅短背心，無褲無鞋；有真實大象輪廓、非人戴象頭，不縮成與兔一樣大。</title><image href="../assets/characters.png" width="2172" height="724"/></svg>
