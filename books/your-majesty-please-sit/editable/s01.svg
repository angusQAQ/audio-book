<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>淡金沙灘，左側擬人小白兔丁丁站在自己堆的一座小沙城堡旁，右側擬人大象圓圓前來。只有一座小城堡，兩個圓塔及一面小黃三角旗；城堡是玩具比例，不供動物走進去；人物全身完整。</title><image href="../assets/illustrations/s01.png" width="1774" height="887"/></svg>
