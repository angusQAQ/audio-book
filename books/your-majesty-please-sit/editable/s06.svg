<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>城堡右前方新堆出一個寬低的濕沙坡，上方已拍平，可讓大象坐；丁丁用前掌拍平頂面，圓圓站右側準備，城堡左後未動，沒有木椅或工具。</title><image href="../assets/illustrations/s06.png" width="1774" height="887"/></svg>
<text x="52" y="69.68" fill="#564535" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">她</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">把</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">沙</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">堆</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">成</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">矮</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">矮</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">的</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">坡</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
