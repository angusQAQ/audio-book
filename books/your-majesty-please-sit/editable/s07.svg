<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>圓圓完整身體穩坐在大沙坡頂部，兩腳着地，笑得舒適；丁丁站在左側自豪地看，大沙坡被稍壓低但尚未露出空坐印；一個城堡一面旗。</title><image href="../assets/illustrations/s07.png" width="1774" height="887"/></svg>
