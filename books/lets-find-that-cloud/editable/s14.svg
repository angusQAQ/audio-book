<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="white"/><svg x="120.18862911795964" y="106.0" width="709.6227417640807" height="399.375" viewBox="0 0 1672 941"><title>兩人在下半頁向右走，琪琪回頭等樂樂並伸出左手邀請，右手拿唯一風車；樂樂笑着向前。上方右側一朵普通柔軟新雲，留給讀者想像它像甚麼，不給明確動物答案。白紙與淡藍曲風線連接結尾。</title><image href="../assets/illustrations/s14.png" width="1672" height="941"/></svg>
