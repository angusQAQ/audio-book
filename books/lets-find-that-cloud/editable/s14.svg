<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="white"/><svg x="120.18862911795964" y="106.0" width="709.6227417640807" height="399.375" viewBox="0 0 1672 941"><title>兩人在下半頁向右走，阿米回頭等小澄並伸出左手邀請，右手拿唯一風車；小澄笑着向前。上方右側一朵普通柔軟新雲，留給讀者想像它像甚麼，不給明確動物答案。白紙與淡藍曲風線連接結尾。</title><image href="../assets/illustrations/s14.png" width="1672" height="941"/></svg>
<text x="52" y="58.432" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="22.8">阿</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">米</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">看</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">見</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">一</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">朵</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">新</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">的</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">雲</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">：</tspan></text>
<text x="534" y="67.096" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="22.8">「</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">走</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">去</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">找</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">那</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">朵</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">雲</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">」</tspan></text>
<text x="534" y="107.296" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="22.8">這</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">一</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">次</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">她</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">等</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">澄</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">一</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">起</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">走</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">。</tspan></text>
