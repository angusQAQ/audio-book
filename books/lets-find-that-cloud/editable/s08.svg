<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="white"/><svg x="29.982978723404187" y="-2.842170943040401e-14" width="900.0340425531916" height="506.00000000000006" viewBox="0 0 1672 940"><title>右半近景，琪琪坐在乾燥草地，只有一支小風車平放身旁；樂樂蹲在同一視線高度，遞來一片完整的淡褐落葉。兩人溫和對望，沒有擁抱或指責。左方白。</title><image href="../assets/illustrations/s08.png" width="1672" height="940"/></svg>
