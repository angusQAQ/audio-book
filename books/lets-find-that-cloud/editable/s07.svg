<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="white"/><svg x="30.461211477152006" y="2.842170943040401e-14" width="899.077577045696" height="505.99999999999994" viewBox="0 0 1672 941"><title>右下小草坡，阿米仰頭站着，右手風車稍垂；小澄在她身後不遠。右上很小的胖魚形雲。人物不失散、不哭鬧。左方全白，留出安靜。</title><image href="../assets/illustrations/s07.png" width="1672" height="941"/></svg>
<text x="52" y="180.096" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="22.8">阿</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">米</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">走</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">到</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">坡</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">抬</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">起</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">頭</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">。</tspan></text>
<text x="52" y="211.63199999999998" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="22.8">雲</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">還</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">在</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">遠</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">遠</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">的</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">天</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">上</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">。</tspan></text>
<text x="52" y="254.296" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="22.8">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">怎</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">麼</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">越</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">走</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">，</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">越</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="34.2">趕</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">不</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">上</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">呢</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">？</tspan><tspan font-family="Iansui" font-weight="400" font-size="22.8">」</tspan></text>
