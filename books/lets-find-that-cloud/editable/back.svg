<svg x="612.5" y="329.0" width="231.0" height="154.0" viewBox="0 0 1536 1024"><title>兩位同行的孩子</title><image href="../assets/illustrations/cover.png" width="1536" height="1024"/></svg>
<svg x="108.125" y="167.0" width="63.75" height="170.0" viewBox="0 0 384.0 1024"><title>阿米，約八歲女孩。黑色短鮑伯頭、不對稱瀏海，自己左側兩枚珊瑚髮夾；芥末黃長袖上衣、天藍小胸袋、深藍綠及膝短褲、珊瑚帆布鞋、鈷藍斜背小袋。右手帶一支珊瑚橙四葉紙風車、藍綠軸心和木柄。急着出發，也願意重新聽朋友說話。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
<svg x="275.125" y="167.0" width="63.75" height="170.0" viewBox="768.0 0 384.0 1024"><title>小澄，約八歲男孩。黑色圓短髮、一撮翹髮；米白短袖、天藍短吊帶褲、苔綠雨靴。沒有袋子和風車。喜歡留意葉子、影子和小水窪，不是阿米的弟弟，而是同行的朋友。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
