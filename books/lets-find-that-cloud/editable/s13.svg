<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="white"/><svg x="140.20085015940487" y="82.0" width="755.5982996811903" height="425.25" viewBox="0 0 1672 941"><title>兩人沿來時小路並肩慢步，小澄向草葉上的小紅瓢蟲望去，阿米也看見了。右手風車以幾條短淡黃線輕輕旋轉。左下露一點水窪，遠處淡褐葉船。上方白，孩子臉避中縫。</title><image href="../assets/illustrations/s13.png" width="1672" height="941"/></svg>
