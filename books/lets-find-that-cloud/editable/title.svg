<svg x="92.125" y="248.0" width="90.75" height="242.0" viewBox="0 0 384.0 1024"><title>阿米，約八歲女孩。黑色短鮑伯頭、不對稱瀏海，自己左側兩枚珊瑚髮夾；芥末黃長袖上衣、天藍小胸袋、深藍綠及膝短褲、珊瑚帆布鞋、鈷藍斜背小袋。右手帶一支珊瑚橙四葉紙風車、藍綠軸心和木柄。急着出發，也願意重新聽朋友說話。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
<svg x="264.125" y="248.0" width="90.75" height="242.0" viewBox="768.0 0 384.0 1024"><title>小澄，約八歲男孩。黑色圓短髮、一撮翹髮；米白短袖、天藍短吊帶褲、苔綠雨靴。沒有袋子和風車。喜歡留意葉子、影子和小水窪，不是阿米的弟弟，而是同行的朋友。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
<text x="537" y="214.44" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="JyunsaiKaai" font-weight="700" font-size="63.0">走</tspan><tspan font-family="Iansui" font-weight="400" font-size="42">！</tspan></text>
<text x="536" y="285.24" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="46">去</tspan><tspan font-family="Iansui" font-weight="400" font-size="46">找</tspan><tspan font-family="Iansui" font-weight="400" font-size="46">那</tspan><tspan font-family="Iansui" font-weight="400" font-size="46">朵</tspan><tspan font-family="Iansui" font-weight="400" font-size="46">雲</tspan></text>
<text x="540" y="346.86" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="19">部</tspan><tspan font-family="Iansui" font-weight="400" font-size="19">首</tspan><tspan font-family="Iansui" font-weight="400" font-size="19">故</tspan><tspan font-family="Iansui" font-weight="400" font-size="19">事</tspan><tspan font-family="Iansui" font-weight="400" font-size="19">・</tspan><tspan font-family="Iansui" font-weight="400" font-size="19">走</tspan></text>
