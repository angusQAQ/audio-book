<svg x="89.78125" y="294.0" width="91.43750000000001" height="266.0" viewBox="38.400000000000006 15.36 337.92 983.04"><title>彤彤，八歲女孩；身形修長，窄額、較寬下頰的梨形臉，小細單眼皮、寬短鼻、單側酒窩；栗棕色偏分極短精靈髮型，露耳；湖藍短袖襯衫、深紫及膝A字裙、白短襪、米黃平底鞋。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
<svg x="280.1958762886598" y="294.0" width="94.6082474226804" height="266.0" viewBox="775.6800000000001 5.12 353.28 993.28"><title>老師，四十二歲女性；高大結實，深棕膚色，長菱形臉、高顴骨、長窄微彎鼻、細直眉、小杏眼和較厚嘴唇；黑髮梳成後頸低髻，不戴眼鏡；苔綠短袖襯衫、靛藍九分闊褲、酒紅平底鞋。老師是稱謂，不另作姓名。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
