<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="45.0" y="125.0" width="870.0" height="435.0" viewBox="0 0 1774 887"><title>老師放低相機，指向桌面和矮處的玩具，多多把皮皮移到桌上；兩把椅子保持原位。玩具沒有長大，只有位置改變。</title><image href="../assets/illustrations/s05.png" width="1774" height="887"/></svg>
