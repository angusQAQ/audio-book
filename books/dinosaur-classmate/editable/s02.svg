<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="60.0" y="140.0" width="840.0" height="420.0" viewBox="0 0 1774 887"><title>老師在右把黑色相機準備好，多多在左坐木桌後，手裏小恐龍與臉同框。人物全身連貫；桌前無雜物。</title><image href="../assets/illustrations/s02.png" width="1774" height="887"/></svg>
