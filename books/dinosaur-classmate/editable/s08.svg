<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>老師放下相機指向鏡頭，多多一手摸臉、一手把小恐龍拿回胸前，兩人笑。玩具仍是手掌大小，沒有另一隻。</title><image href="../assets/illustrations/s08.png" width="1774" height="887"/></svg>
