<svg x="85.8245" y="294.0" width="99.351" height="266.0" viewBox="0 0 382.464 1024"><title>多多，八歲男孩；矮壯、寬圓角三角臉、深暖棕膚、大外展耳、寬鼻樑、細長單眼皮、厚短眉、厚上唇；黑色平頂短髮、兩側很短；橙色短袖Polo衫、深海藍短褲、米白短襪、灰藍運動鞋。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
<svg x="278.024" y="294.0" width="98.952" height="266.0" viewBox="769.5360000000001 0 380.928 1024"><title>男老師，五十多歲；非常高瘦、長梯形臉、長彎鼻、細橢圓眼、小八字鬚，頭頂稀疏、兩側銀白短髮，沒有眼鏡；淡紫短袖襯衫、深灰長褲、棕帆布便鞋。與多多不是親屬。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
