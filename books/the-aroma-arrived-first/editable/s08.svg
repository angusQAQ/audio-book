<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="64.31451612903226" y="40.0" width="831.3709677419355" height="520.0" viewBox="0 0 1586 992"><title>婆婆在右下以湯勺盛熱湯，米米在左遞白餐巾；客人雙手在右緣接碗，熱湯由成人端，米米不碰鍋和熱碗；燈在桌外沿，上四成白。</title><image href="../assets/illustrations/s08.png" width="1586" height="992"/></svg>
