<text x="534" y="60.56" fill="#373632" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">叔</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">叔</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">收</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">起</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">雨</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">傘</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
