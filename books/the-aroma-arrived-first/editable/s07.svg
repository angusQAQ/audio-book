<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="136.26008064516128" y="115.0" width="687.4798387096774" height="430.0" viewBox="0 0 1586 992"><title>左下米米笑着抬頭，右方第一位成人客人穿靛藍雨衣、深褲、橄欖色雨鞋，收起藍傘；鏡頭到肩以下，沒有新增主角近臉；上四成白。</title><image href="../assets/illustrations/s07.png" width="1586" height="992"/></svg>
