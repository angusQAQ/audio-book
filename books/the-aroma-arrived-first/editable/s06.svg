<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="64.31451612903226" y="40.0" width="831.3709677419355" height="520.0" viewBox="0 0 1586 992"><title>下半部近景：米米小手把一盞黃色電池燈移到桌外沿，暖光照白碗及右下剛走近的一雙深橄欖色成人雨鞋；客人只到褲腳，無臉；上四成白。</title><image href="../assets/illustrations/s06.png" width="1586" height="992"/></svg>
