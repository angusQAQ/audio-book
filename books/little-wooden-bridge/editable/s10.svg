<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>小木兔坐在紅色小木車上，車已回到左岸，花留在右岸；可可及團團高興，木杯仍托住接合處，兩旗保持原位。 藍色圍巾從畫面後方向前延伸，方向縱向；木板或小橋方向橫向，橫跨藍布。左右兩塊積木及角色在藍布兩側，不在藍布上。</title><image href="../assets/illustrations/s10.png" width="1774" height="887"/></svg>
