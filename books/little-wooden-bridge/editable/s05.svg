<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>團團用一根手指在下面托住木板接合處，使橋面恢復平順；果果在左岸看見辦法，木杯在旁邊地上。</title><image href="../assets/illustrations/s05.png" width="1774" height="887"/></svg>
