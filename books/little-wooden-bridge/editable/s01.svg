<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>可可在左，團團在右，地上藍布是玩具小河，兩塊同高方積木各在一邊。紅色小木車載一朵黃花在左岸，奶白木兔在右岸；木板尚未搭上。 藍色圍巾從畫面後方向前延伸，方向縱向；木板或小橋方向橫向，橫跨藍布。左右兩塊積木及角色在藍布兩側，不在藍布上。 未用來托橋的木杯杯口朝上。</title><image href="../assets/illustrations/s01.png" width="1774" height="887"/></svg>
