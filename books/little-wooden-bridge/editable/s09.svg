<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>黃花放在玩具小兔身旁，兩根小木棒及兩面素色小旗立在橋的兩岸，不在橋面阻路；同一玩具橋與木杯。 藍色圍巾從畫面後方向前延伸，方向縱向；木板或小橋方向橫向，橫跨藍布。左右兩塊積木及角色在藍布兩側，不在藍布上。</title><image href="../assets/illustrations/s09.png" width="1774" height="887"/></svg>
