<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>兩塊板的中間接合處向下垂，可可及時扶住載黃花的小木車，團團伸手準備幫忙；藍布清楚是乾布而非真水。 藍色圍巾從畫面後方向前延伸，方向縱向；木板或小橋方向橫向，橫跨藍布。左右兩塊積木及角色在藍布兩側，不在藍布上。 未用來托橋的木杯杯口朝上。</title><image href="../assets/illustrations/s04.png" width="1774" height="887"/></svg>
