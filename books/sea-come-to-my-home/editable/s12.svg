<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="64.31451612903226" y="40.0" width="831.3709677419355" height="520.0" viewBox="0 0 1586 992"><title>拉遠全景，兩個孩子坐在地面防水墊上，大水盆在兩人之間，乾的米白毛巾在外面成為想像沙灘；三塞兩圈筏浮在盆裏、三顆圓石，濕紙船安靜放在另一塊白布上。左後只有小窗雨線，無地面積水。兩人笑，面孔遠離中縫，頂部三分之一白。</title><image href="../assets/illustrations/s12.png" width="1586" height="992"/></svg>
