<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="96.31451612903226" y="40.0" width="831.3709677419355" height="520.0" viewBox="0 0 1586 992"><title>右下水盆透明側視般看見白紙船已吸水，柔軟塌下並沉在淺水盆底；右側小安沮喪的近臉，圓圓在左下安靜看他。不是水中孩子、不是危險場景；頂部四成全白。</title><image href="../assets/illustrations/s08.png" width="1586" height="992"/></svg>
