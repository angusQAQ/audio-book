<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="64.31451612903226" y="40.0" width="831.3709677419355" height="520.0" viewBox="0 0 1586 992"><title>近景圓圓在左下鼓腮，嘴在水面上方吹氣；右下白紙船繞過三顆光滑圓石，柔和赭黃曲線表示風。水盆邊緣與小島清楚，上方三成白。</title><image href="../assets/illustrations/s05.png" width="1586" height="992"/></svg>
