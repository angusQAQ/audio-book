<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="64.31451612903226" y="40.0" width="831.3709677419355" height="520.0" viewBox="0 0 1586 992"><title>俯視特寫兩對孩子的手，合力把恰好三個棕色圓柱軟木塞平行並排，用恰好兩條珊瑚橡皮圈環繞束牢，形成扁平小筏；清楚六個圓端和兩條圈。濕紙船在旁邊白布上，盆的一角可見；上方三分之一全白。</title><image href="../assets/illustrations/s10.png" width="1586" height="992"/></svg>
