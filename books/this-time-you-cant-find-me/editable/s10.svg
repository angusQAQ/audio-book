<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>左邊紙箱裏依依露出笑臉，沒有帽子；冬冬由右側椅子走向紙箱，找到依依；同一頂帽子仍在右邊椅座。</title><image href="../assets/illustrations/s10.png" width="1774" height="887"/></svg>
<text x="52" y="60.56" fill="#3D414C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">紙</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">箱</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">裏</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">傳</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">噗</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">的</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">一</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">聲</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
<text x="534" y="69.68" fill="#3D414C" font-family="Iansui,芫荽"><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">依</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">依</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">忍</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">不</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">住</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">出</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
