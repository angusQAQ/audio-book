<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>白紙兔耳帽獨立放在右側椅背後，只露長耳；彤彤已脫帽、悄悄蹲進左側紙箱，黑高馬尾仍在頭上；冬冬在旁邊遮眼。</title><image href="../assets/illustrations/s07.png" width="1774" height="887"/></svg>
