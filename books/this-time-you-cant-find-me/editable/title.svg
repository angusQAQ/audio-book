<svg x="278.024" y="294.0" width="98.952" height="266.0" viewBox="769.5360000000001 0 380.928 1024"><title>冬冬，八歲男孩；較矮結實、圓角方臉、鈍圓鼻、細眉、淡雀斑，小眼戴芥末黃圓細框眼鏡；白暖膚，銅栗短鬈髮加剃短兩側；霧藍短袖無繩帽衫、磚紅長褲、深棕帆布鞋。兩人不是親屬。</title><image href="../assets/characters.png" width="1536" height="1024"/></svg>
