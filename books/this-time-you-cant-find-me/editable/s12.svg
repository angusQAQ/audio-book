<text x="52" y="99.56" fill="#3D414C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">把</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">兩</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">隻</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">紙</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">耳</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">朵</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">輕</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">輕</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">折</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">下</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
<text x="534" y="69.68" fill="#3D414C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">換</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">藏</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">起</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">你</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">找</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
<text x="534" y="111.68" fill="#3D414C" font-family="Iansui,芫荽"><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">他</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">又</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">說</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">這</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">次</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">可</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">不</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">會</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
<text x="534" y="153.68" fill="#3D414C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">話</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">剛</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">說</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">完</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">他</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">自</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">己</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">先</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
