<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>冬冬在右邊戴上同一頂帽子，兩隻紙耳朵向後折下，自己先笑起來；彤彤在左邊以手遮眼準備數數，兩人身體與鞋子完整。</title><image href="../assets/illustrations/s12.png" width="1774" height="887"/></svg>
<text x="52" y="60.56" fill="#3D414C" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">冬</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">冬</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">戴</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">好</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">帽</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
