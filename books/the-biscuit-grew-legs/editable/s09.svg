<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>右側大綠葉像遮棚，葉下只有一個小洞；三隻螞蟻把同一碎餅往洞口搬，其中最前方的一隻可部分進洞，其餘身體仍完整可辨。不是人造門、地底家具或屋子剖面。兩孩子在左後方完整蹲着看，樹枝在通過後留於後方。</title><image href="../assets/illustrations/s09.png" width="1774" height="887"/></svg>
