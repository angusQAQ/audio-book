<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="90.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>單一連續的近地視角：右前景清楚看見一隻自然形態棕螞蟻，三段身體、六足及兩根屈曲觸角，用嘴咬住唯一小碎餅。安安在左後方完整蹲着看，元元也在後方蹲下。兩人分別拿圓餅乾和方餅乾，不用放大框或第二張圖重複同一螞蟻。</title><image href="../assets/illustrations/s05.png" width="1774" height="887"/></svg>
