<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>元元仍蹲在左方，一手伸向地面而未碰樹枝，另一手拿方餅乾。安安拿圓餅乾，一隻手輕輕示意等等。右方唯一碎餅旁原來一隻螞蟻，另外兩隻沿原有路線走來，共三隻。小洞與樹枝仍在原處。</title><image href="../assets/illustrations/s07.png" width="1774" height="887"/></svg>
