<svg x="100.77808471454881" y="191.66666666666669" width="71.44383057090239" height="158.66666666666666" viewBox="140.0 0 326.0 724"><title>安安，七歲女孩，矮而結實；深棕膚、寬方臉、明顯但柔和的方下巴、高額、寬距細長小眼、平直短眉、短寬鼻、厚上唇，笑時露小門牙缺口。黑色厚直髮剪成貼下巴的方形短髮、極短齊瀏海，無髮夾無眼鏡。芥黃短褲式吊帶褲、奶白短袖上衣、白短襪及暗紅魔術貼鞋。</title><image href="../assets/characters.png" width="2172" height="724"/></svg>
<svg x="291.63996316758744" y="191.66666666666669" width="51.72007366482507" height="158.66666666666666" viewBox="1214.0 0 236.0000000000001 724"><title>元元，七歲男孩，比安安高約一成、瘦長；淺膚、窄長臉、尖圓下巴、近距細小下垂眼、柔細棕眉、稍長而前突的鼻、外展圓耳、鼻樑少量雀斑及薄唇。紅棕色筆直短髮、側分而不捲，無眼鏡。藍綠色T恤、莓紅短褲、白短襪、深藍魔術貼鞋；不是前作捲髮眼鏡男孩。</title><image href="../assets/characters.png" width="2172" height="724"/></svg>
