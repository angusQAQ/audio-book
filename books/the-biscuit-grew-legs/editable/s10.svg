<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>回到孩子的中全景：安安把手中有一個缺口的圓餅乾咬下第二口，留下更大的連續缺口，表情好笑但不塞滿嘴。元元拿方餅乾在旁笑。兩個身體、手臂和鞋完整相連。大葉子下的碎餅和三隻螞蟻已進洞，不再畫另一塊地上碎餅；蜜蜂、蝴蝶沒有回來。</title><image href="../assets/illustrations/s10.png" width="1774" height="887"/></svg>
