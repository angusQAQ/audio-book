<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>低桌奶白小碟是空的，兩個手偶仍平放遠側；三個人手上已沒有餅乾。可可用手指自己的肚子、大笑，嘴角有一點細餅乾屑，奶奶看空碟逗她，姐姐笑。 可可坐在低桌右前方地上，不坐在桌面；桌面只有兩個手偶與空碟。</title><image href="../assets/illustrations/s11.png" width="1774" height="887"/></svg>
