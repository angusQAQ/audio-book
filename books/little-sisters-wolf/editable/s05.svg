<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>較近的三人表情構圖，可可舉灰狼、另一隻手指嘴巴；奶奶笑得向前傾，星星驚訝挑眉；兩個手偶清楚、沒有真餅乾。</title><image href="../assets/illustrations/s05.png" width="1774" height="887"/></svg>
