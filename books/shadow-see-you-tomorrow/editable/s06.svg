<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="135.0" y="100.0" width="690.0" height="460.0" viewBox="0 0 1536 1024"><title>爸爸右邊試把小木熊一隻腳放進褲袋，平平左邊笑着拿空布袋，皮球在地上。</title><image href="../assets/illustrations/s06.png" width="1536" height="1024"/></svg>
<text x="52" y="60.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">爸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">爸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">也</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">想</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">試</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
<text x="52" y="99.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">把</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">熊</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">往</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">自</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">己</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">的</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">口</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">袋</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">裏</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">塞</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
<text x="52" y="138.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">也</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">塞</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">不</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">進</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
