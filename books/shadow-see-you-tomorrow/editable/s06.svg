<text x="534" y="99.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">別</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">塞</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">用</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">袋</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">就</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">行</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
