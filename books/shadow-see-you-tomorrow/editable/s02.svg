<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="135.0" y="100.0" width="690.0" height="460.0" viewBox="0 0 1536 1024"><title>爸爸在右邊坐在地板上抱小木熊，故意像小朋友般摸肚子；平平左邊站着拍胸口。</title><image href="../assets/illustrations/s02.png" width="1536" height="1024"/></svg>
<text x="52" y="60.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">爸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">爸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">着</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">回</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">答</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan></text>
<text x="52" y="99.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">好</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">呀</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">當</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">朋</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">友</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
<text x="534" y="60.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">他</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">抱</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">着</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">熊</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">坐</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">在</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">地</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">上</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">喊</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan></text>
<text x="534" y="99.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">爸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">爸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">肚</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">餓</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
<text x="534" y="138.56" fill="#333B49" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">平</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">平</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">拍</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">拍</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">胸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">口</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">等</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
