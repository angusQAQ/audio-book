<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>媽媽兩腳都站近側乾草，向泥裏東東伸手；東東伸手握媽媽的手，兩條手臂清楚連接且只有正常兩手；兩靴仍穿腳、紅球仍在遠側草。</title><image href="../assets/illustrations/s05.png" width="1774" height="887"/></svg>
