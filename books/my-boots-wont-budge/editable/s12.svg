<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>母子已到遠離泥地的乾草區，兩隻空橙雨靴直立放成相距約半米的小球門；東東穿襪在球門旁招手，媽媽穿灰鞋準備踢唯一紅球；背景角落可淡描淺泥但不是球門位置。沒有第三隻靴或多個球。</title><image href="../assets/illustrations/s12.png" width="1774" height="887"/></svg>
