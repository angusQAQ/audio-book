<svg x="112.73449830890642" y="186.425" width="47.53100338218715" height="169.15" viewBox="107.0 0 248.0 882.5649999999999"><title>東東，八歲男孩；中等結實、寬長菱形臉、深橄欖膚、細長外眼角下垂的眼、厚平眉、寬扁方鼻、笑時兩側深酒窩。黑色短蓬直髮、寬額，無眼鏡。翠綠無袖背心外罩奶白T恤、深紫短褲、鮮橙及小腿雨靴，裏面橙白橫條紋襪。</title><image href="../assets/characters.png" width="1774" height="887"/></svg>
<svg x="287.69729425028186" y="186.425" width="59.60541149943627" height="169.15" viewBox="888.0000000000001 0 310.99999999999983 882.5649999999999"><title>媽媽，三十多歲；比孩子高約1.5倍，中等結實、成年寬長菱形臉與明確細眼角紋，同樣深橄欖膚、細長下垂眼、厚平眉、寬扁方鼻、雙深酒窩。黑色斜編辮收進低髮髻，無眼鏡。群青短袖工裝連身褲，灰白長袖內衣捲袖，灰色運動鞋；不是穿裙的固定母親模板。</title><image href="../assets/characters.png" width="1774" height="887"/></svg>
