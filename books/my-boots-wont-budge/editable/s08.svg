<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>媽媽與東東仍坐近側草上，媽媽指向泥裏那兩隻空靴，孩子抱肚笑；兩隻襪腳連身體、沒有另多畫靴，只有遠側一個紅球。</title><image href="../assets/illustrations/s08.png" width="1774" height="887"/></svg>
<text x="52" y="60.56" fill="#35483E" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">媽</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">媽</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">指</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">指</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">泥</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">地</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan></text>
<text x="52" y="99.56" fill="#35483E" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">們</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">拉</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">出</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">你</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
<text x="52" y="138.56" fill="#35483E" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">還</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">沒</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">拉</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">出</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">雨</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">靴</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">呢</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
<text x="534" y="60.56" fill="#35483E" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">東</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">東</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">得</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">抱</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">住</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">肚</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
