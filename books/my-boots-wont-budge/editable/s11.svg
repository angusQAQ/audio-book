<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>東東穿條紋襪沿泥地外的乾草邊繞到遠側，抱回唯一紅球；媽媽在近側草上拿着兩隻空橙靴，泥地只有淺鞋印，沒有孩子直接再踩泥。完整連接的人物。</title><image href="../assets/illustrations/s11.png" width="1774" height="887"/></svg>
