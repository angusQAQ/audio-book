<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>兩人已坐在近側乾草地上，手剛拉住或自然放開，東東雙腳清楚穿橙白條紋襪、沒有靴，兩腿連到身體；唯一兩隻橙雨靴空着直立留在泥地，靴口可見空的。媽媽灰運動鞋仍穿着。遠側紅球未變。</title><image href="../assets/illustrations/s07.png" width="1774" height="887"/></svg>
