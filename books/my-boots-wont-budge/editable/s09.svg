<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>兩人都蹲在近側草邊，東東穿襪的腳留在乾草、雙手抓泥裏左邊那一隻橙雨靴靴口；媽媽抓右邊另一隻；只有一對空靴，不要把靴再穿在孩子腳上。</title><image href="../assets/illustrations/s09.png" width="1774" height="887"/></svg>
