<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>媽媽在近側草上向後傾拉東東的手，東東身體朝媽媽、膝蓋向上抬，雙靴還留在淺泥；未露襪腳，停在拔出前一刻，兩人手臂相連而非同向各自拉空氣。</title><image href="../assets/illustrations/s06.png" width="1774" height="887"/></svg>
