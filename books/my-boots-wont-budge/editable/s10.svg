<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>兩人站或蹲在乾草邊，各手持剛拔出的一隻橙雨靴，鞋底有一點濕泥；泥地只剩兩個淺鞋印、沒有第三隻靴；東東兩隻條紋襪腳仍露出，媽媽穿灰鞋，紅球遠側。</title><image href="../assets/illustrations/s10.png" width="1774" height="887"/></svg>
