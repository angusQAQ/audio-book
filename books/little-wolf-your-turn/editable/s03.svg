<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="white"/><svg x="170.20988310308184" y="48.0" width="789.5802337938363" height="444.375" viewBox="0 0 1672 941"><title>右半頁小狗拿着一本無字故事書，遞兩張角色卡給小狼與狐狸。卡上只有簡單面具圖案，沒有字。小狼的耳朵微垂。左半頁留白。</title><image href="../assets/illustrations/s03.png" width="1672" height="941"/></svg>
<text x="53" y="178.00384" fill="#303536" font-family="Iansui,芫荽"><tspan font-size="22.8">「</tspan><tspan font-size="25.536000000000005">狼</tspan><tspan font-size="22.8">演</tspan><tspan font-size="22.8">壞</tspan><tspan font-size="22.8">蛋</tspan><tspan font-size="22.8">，</tspan><tspan font-size="25.536000000000005">狐</tspan><tspan font-size="25.536000000000005">狸</tspan><tspan font-size="22.8">演</tspan><tspan font-size="22.8">小</tspan><tspan font-size="22.8">偷</tspan><tspan font-size="22.8">。</tspan></text>
<text x="53" y="212.00384" fill="#303536" font-family="Iansui,芫荽"><tspan font-size="22.8">就</tspan><tspan font-size="22.8">照</tspan><tspan font-size="22.8">書</tspan><tspan font-size="22.8">裏</tspan><tspan font-size="22.8">的</tspan><tspan font-size="22.8">來</tspan><tspan font-size="22.8">吧</tspan><tspan font-size="22.8">！</tspan><tspan font-size="22.8">」</tspan><tspan font-size="22.8">小</tspan><tspan font-size="25.536000000000005">狗</tspan><tspan font-size="22.8">說</tspan><tspan font-size="22.8">。</tspan></text>
