<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="white"/><svg x="100.22848034006381" y="28.00000000000003" width="859.5430393198724" height="483.74999999999994" viewBox="0 0 1672 941"><title>右半頁狐狸拿起一封無字小信，昂首想像自己當郵差；小狼在旁邊笑着點頭。狐狸的芥末短圍巾與白尾尖清楚。左半頁留白。</title><image href="../assets/illustrations/s09.png" width="1672" height="941"/></svg>
<text x="53" y="184.096" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Yomogi" font-size="34.2">狐</tspan><tspan font-family="Yomogi" font-size="34.2">狸</tspan><tspan font-family="Iansui" font-size="22.8">聽</tspan><tspan font-family="Iansui" font-size="22.8">見</tspan><tspan font-family="Iansui" font-size="22.8">了</tspan><tspan font-family="Iansui" font-size="22.8">：</tspan></text>
<text x="53" y="215.63199999999998" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-size="22.8">「</tspan><tspan font-family="Iansui" font-size="22.8">我</tspan><tspan font-family="Iansui" font-size="22.8">也</tspan><tspan font-family="Iansui" font-size="22.8">不</tspan><tspan font-family="Iansui" font-size="22.8">想</tspan><tspan font-family="Iansui" font-size="22.8">當</tspan><tspan font-family="Iansui" font-size="22.8">小</tspan><tspan font-family="Iansui" font-size="22.8">偷</tspan><tspan font-family="Iansui" font-size="22.8">。</tspan></text>
<text x="53" y="249.63199999999998" fill="#303536" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-size="22.8">我</tspan><tspan font-family="Iansui" font-size="22.8">想</tspan><tspan font-family="Iansui" font-size="22.8">當</tspan><tspan font-family="Iansui" font-size="22.8">把</tspan><tspan font-family="Iansui" font-size="22.8">信</tspan><tspan font-family="Iansui" font-size="22.8">送</tspan><tspan font-family="Iansui" font-size="22.8">對</tspan><tspan font-family="Iansui" font-size="22.8">地</tspan><tspan font-family="Iansui" font-size="22.8">方</tspan><tspan font-family="Iansui" font-size="22.8">的</tspan><tspan font-family="Iansui" font-size="22.8">郵</tspan><tspan font-family="Iansui" font-size="22.8">差</tspan><tspan font-family="Iansui" font-size="22.8">。</tspan><tspan font-family="Iansui" font-size="22.8">」</tspan></text>
