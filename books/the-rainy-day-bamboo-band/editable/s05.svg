<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="135.0" y="100.0" width="690.0" height="460.0" viewBox="0 0 1536 1024"><title>公公在右邊橫吹竹笛，朵朵在左邊笑着聽。</title><image href="../assets/illustrations/s05.png" width="1536" height="1024"/></svg>
<text x="52" y="69.68" fill="#323B36" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">公</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">公</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">拿</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">出</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">竹</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">笛</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">吹</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">一</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">段</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
<text x="534" y="60.56" fill="#323B36" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">他</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">問</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan></text>
<text x="534" y="108.68" fill="#323B36" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">吹</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">笛</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">你</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">敲</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">竹</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">筒</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
<text x="534" y="141.56" fill="#323B36" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">好</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">不</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">好</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">？</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
<text x="534" y="189.68" fill="#323B36" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">朵</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">朵</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">着</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">回</tspan><tspan font-family="JyunsaiKaai" font-weight="700" font-size="36.0">答</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">好</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">呀</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
