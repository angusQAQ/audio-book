<svg x="67.0" y="319.0636530442035" width="137.0" height="215.87269391159302" viewBox="0.0 0 399.66666666666663 629.76"><title>卓卓，八歲男孩；瘦長身形、很窄的長橢圓臉與略尖下巴、白皙膚、鼻樑及顴骨細雀斑、小細眼、濃而短的上挑眉、尖鼻、微翹笑嘴。深栗色短髮，頂部一束自然向上彎的粗髮，沒有眼鏡、沒有圓鬈髮。鈷藍短袖睡衣上衣及同色及膝短褲，奶白包頭拖鞋。</title><image href="../assets/characters.png" width="1199" height="1312"/></svg>
<svg x="259.0" y="319.0636530442035" width="137.0" height="215.87269391159302" viewBox="399.66666666666663 0 399.66666666666663 629.76"><title>言言，八歲女孩，卓卓的朋友而非親屬；身高稍高、寬方圓角臉、橄欖褐膚、平直粗眉、小細長單眼皮、寬平鼻、厚下唇、開心時長笑口。黑色極短自然捲髮，無眼鏡、無辮子與瀏海。芥黃短袖睡衣上衣、磚紅及膝短褲、紫色包頭拖鞋。</title><image href="../assets/characters.png" width="1199" height="1312"/></svg>
