<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>夜晚臥室柔和局部藍色但上方文字仍純白。兩張完整床頭與床尾都在畫面內，卓卓在左床、言言在右床各露頭肩。卓卓的腿仍在被子下，腳趾從左床被尾一角伸出，形成被子鼓包的明確原因，不畫分離的腳。團團仍在地上墊子睡，小魚在旁，兩人笑。</title><image href="../assets/illustrations/s12.png" width="1774" height="887"/></svg>
<text x="52" y="60.56" fill="#354257" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">晚</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">上</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">被</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">子</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">又</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">鼓</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">起</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">一</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">塊</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
<text x="534" y="60.56" fill="#354257" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">又</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">是</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">團</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">團</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">？</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">言</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">言</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">問</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">。</tspan></text>
<line data-proper-name="團團" x1="606.4" y1="64.76" x2="653.6" y2="64.76" stroke="#354257" stroke-width="0.7"/>
<line data-proper-name="言言" x1="702.4" y1="64.76" x2="749.6" y2="64.76" stroke="#354257" stroke-width="0.7"/>
<text x="534" y="99.56" fill="#354257" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">卓</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">卓</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">伸</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">出</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">腳</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">趾</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">笑</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">着</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">說</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">：</tspan></text>
<line data-proper-name="卓卓" x1="534.4" y1="103.76" x2="581.6" y2="103.76" stroke="#354257" stroke-width="0.7"/>
<text x="534" y="138.56" fill="#354257" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">「</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">這</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">次</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">是</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">我</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">」</tspan></text>
