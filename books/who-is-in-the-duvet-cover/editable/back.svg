<svg x="84.71392276422765" y="189.4" width="103.5721544715447" height="163.2" viewBox="0.0 0 399.66666666666663 629.76"><title>卓卓，八歲男孩；瘦長身形、很窄的長橢圓臉與略尖下巴、白皙膚、鼻樑及顴骨細雀斑、小細眼、濃而短的上挑眉、尖鼻、微翹笑嘴。深栗色短髮，頂部一束自然向上彎的粗髮，沒有眼鏡、沒有圓鬈髮。鈷藍短袖睡衣上衣及同色及膝短褲，奶白包頭拖鞋。</title><image href="../assets/characters.png" width="1199" height="1312"/></svg>
