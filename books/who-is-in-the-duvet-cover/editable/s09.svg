<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>卓卓左側握短棒尾端，把一條珊瑚色小魚布玩具放在被套右側開口外、靠床尾，短線連着小魚。言言退到右側讓路。被套口只冒兩隻貓耳及少量頭頂，其餘藏住，無第二隻貓。</title><image href="../assets/illustrations/s09.png" width="1774" height="887"/></svg>
