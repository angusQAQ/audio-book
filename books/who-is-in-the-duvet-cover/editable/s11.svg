<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>兩張矮床都鋪好淺藍被套裝着奶白被芯，芥黃枕頭各一。卓卓左、言言右看成果。團團在床邊深藍小墊子抱珊瑚色小魚睡着，玩具短棒放墊子旁，旅行袋放右床腳邊。</title><image href="../assets/illustrations/s11.png" width="1774" height="887"/></svg>
