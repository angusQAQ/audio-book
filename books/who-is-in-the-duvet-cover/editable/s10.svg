<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="white"/><svg x="20.0" y="100.0" width="920.0" height="460.0" viewBox="0 0 1774 887"><title>卓卓把同一短棒小魚往床邊小墊子移動，團團整隻從床上被套開口跳到地上墊子追玩具；單貓完整四肢尾巴，動作短距離自然，言言在右側拍手笑。 團團必須從左床的被套開口跳出；右床藍布平放。</title><image href="../assets/illustrations/s10.png" width="1774" height="887"/></svg>
<text x="52" y="60.56" fill="#354257" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">小</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">魚</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">往</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">旁</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">邊</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">一</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">跳</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">，</tspan></text>
<text x="52" y="99.56" fill="#354257" font-family="Iansui,芫荽"><tspan font-family="Iansui" font-weight="400" font-size="24">團</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">團</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">也</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">跟</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">着</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">跳</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">了</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">出</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">來</tspan><tspan font-family="Iansui" font-weight="400" font-size="24">！</tspan></text>
