name: Prepare and verify Cantonese MP3
on:
  workflow_dispatch:
  push:
    branches: [main, storybook-playground]
    paths:
      - 'library.json'
      - 'requirements.txt'
      - 'scripts/generate_audio.py'
      - '.github/workflows/prepare-audio.yml'
permissions:
  contents: write
concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache/edge-tts
          key: edge-tts-hiu-maan-12-v1-${{ hashFiles('library.json', 'requirements.txt') }}
          restore-keys: edge-tts-hiu-maan-12-v1-
      - name: Generate requested voice
        run: python scripts/generate_audio.py --jobs 3
      - name: Validate original PDF, all MP3 files and browser behavior
        run: |
          python scripts/validate_assets.py --require-edge
          npm test
      - name: Commit verified audio to the same GitHub branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/audio library.json library.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate verified HiuMaan Cantonese MP3 at -12%"
            git push origin HEAD:${{ github.ref_name }}
          fi
