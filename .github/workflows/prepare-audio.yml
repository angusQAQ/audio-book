name: Prepare and verify Cantonese MP3
on:
  workflow_dispatch:
  push:
    branches: [apple-reader]
    paths: ['scripts/generate_audio.py', '.github/workflows/prepare-audio.yml']
permissions:
  contents: write
concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install speech dependencies
        run: pip install -r requirements.txt
      - name: Compare speech service boundary requests
        run: python scripts/probe_tts.py
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/cache/restore@v5
        id: speech-cache
        with:
          path: .cache/edge-tts
          key: edge-tts-hiu-maan-12-words-v2-${{ hashFiles('library.json', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: edge-tts-hiu-maan-12-words-v2-
      - name: Generate requested voice
        run: python scripts/generate_audio.py --jobs 2
      - name: Preserve verified speech cache even after a service interruption
        if: always() && hashFiles('.cache/edge-tts/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .cache/edge-tts
          key: edge-tts-hiu-maan-12-words-v2-${{ hashFiles('library.json', 'requirements.txt') }}-${{ github.run_id }}
      - name: Validate original PDF, all MP3 files and browser behavior
        run: |
          python scripts/validate_assets.py --require-edge
          npm test
      - name: Commit verified audio to the same GitHub branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/audio library.json library.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate verified HiuMaan Cantonese MP3 at -12%"
            git push origin HEAD:${{ github.ref_name }}
          fi
