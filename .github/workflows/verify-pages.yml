name: Verify published reading website
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
permissions:
  contents: read
concurrency:
  group: verify-published-pages
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this version and test the actual website
        env:
          READING_SITE_URL: https://angusqaq.github.io/audio-book/
          REQUIRE_EDGE: '1'
        run: node scripts/check_live_site.mjs
